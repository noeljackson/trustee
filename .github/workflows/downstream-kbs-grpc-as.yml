name: Downstream KBS gRPC AS image

on:
  push:
    branches:
      - downstream/confidential-storage

permissions: {}

concurrency:
  group: downstream-kbs-grpc-as-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-amd64:
    name: Publish amd64 KBS and RVPS image
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout the exact deployment source
      packages: write # publish into the fork-owned package namespace
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact KBS image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/staged-images/kbs-grpc-as
          SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          tag="v0.21.0-path-acl-${short_sha}"
          docker buildx build \
            --platform linux/amd64 \
            --file kbs/docker/coco-as-grpc/Dockerfile \
            --tag "${IMAGE}:${tag}" \
            --label "org.opencontainers.image.source=${SOURCE_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            .
